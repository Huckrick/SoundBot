name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: soundbot-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary=av -r backend/requirements.txt
          python -m pip install -r backend/requirements-build.txt
          npm ci --ignore-scripts --progress=false
          python -m pip check

      - name: Run Python contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run Electron and renderer contracts
        run: |
          node --check main.js
          node --check preload.js
          node --check assets/i18n.js
          node tests/frontend/check_renderer_contract.js

      - name: Verify repository diff hygiene
        run: git diff --check
