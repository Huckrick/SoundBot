name: Validate

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: soundbot-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary=av -r backend/requirements.txt
          python -m pip install -r backend/requirements-build.txt
          npm ci --ignore-scripts --progress=false
          python -m pip check

      - name: Verify repository hygiene
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          tracked_ignored = subprocess.check_output(
              ["git", "ls-files", "-ci", "--exclude-standard"],
              text=True,
          ).splitlines()
          if tracked_ignored:
              raise SystemExit(
                  "Ignored files are still tracked:\n" + "\n".join(tracked_ignored)
              )

          tracked = subprocess.check_output(
              ["git", "ls-files"],
              text=True,
          ).splitlines()
          forbidden_names = {".DS_Store", "indexed_files_meta.json"}
          forbidden_prefixes = (
              "backend/db/",
              "temp_clips/",
              "test_audio/",
          )
          forbidden_paths = {"config/user_config.json"}
          unsafe = [
              path
              for path in tracked
              if Path(path).name in forbidden_names
              or path in forbidden_paths
              or path.startswith(forbidden_prefixes)
          ]
          if unsafe:
              raise SystemExit(
                  "Private runtime files are tracked:\n" + "\n".join(unsafe)
              )

          config = json.loads(Path("config/ai_config.json").read_text(encoding="utf-8"))

          def nonempty_api_keys(value, prefix=""):
              if isinstance(value, dict):
                  for key, child in value.items():
                      child_prefix = f"{prefix}.{key}" if prefix else key
                      if key.lower() == "api_key" and child:
                          yield child_prefix
                      yield from nonempty_api_keys(child, child_prefix)
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      yield from nonempty_api_keys(child, f"{prefix}[{index}]")

          exposed = list(nonempty_api_keys(config))
          if exposed:
              raise SystemExit(
                  "Default AI configuration contains non-empty API keys at: "
                  + ", ".join(exposed)
              )
          PY

      - name: Run Python contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run Electron and renderer contracts
        run: |
          node --check main.js
          node --check preload.js
          node --check assets/i18n.js
          node tests/frontend/check_renderer_contract.js

      - name: Verify repository diff hygiene
        run: git diff --check
