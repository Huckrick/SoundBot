name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.4) — required for manual dispatch'
        required: true
        default: 'v0.1.4'

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  build-models:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: pip install transformers torch torchaudio huggingface_hub

      - name: Download AI models
        run: python scripts/download_models.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Create Models package
        run: |
          mkdir -p release
          cd models
          zip -r ../release/models.zip .
          cd ..
          echo "Models package created:"
          ls -lh release/

      - name: Upload Models artifact
        uses: actions/upload-artifact@v4
        with:
          name: models-package
          path: release/models.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r backend/requirements.txt

      - name: Build PyInstaller backend
        run: |
          cd backend
          pyinstaller main.spec --distpath ../dist/backend --workpath ../dist/build --noconfirm

      - name: Verify backend build
        run: |
          echo "=== Verifying backend build ==="
          if [ -d "dist/backend/soundbot-backend" ]; then
            echo "[OK] Backend directory exists"
            ls -la dist/backend/soundbot-backend/
            du -sh dist/backend/soundbot-backend

            if [ -f "dist/backend/soundbot-backend/soundbot-backend" ]; then
              echo "[OK] Backend executable exists"
            else
              echo "[ERROR] Backend executable not found"
              exit 1
            fi

            if [ -d "dist/backend/soundbot-backend/_internal" ] || [ -d "dist/backend/soundbot-backend/lib" ]; then
              echo "[OK] Runtime directory exists"
            else
              echo "[ERROR] Runtime directory not found"
              exit 1
            fi
          else
            echo "[ERROR] Backend directory not found"
            ls -la dist/backend/
            exit 1
          fi

      - name: Test backend startup
        run: |
          echo "=== Testing backend can start ==="
          export SOUNDBOT_PORT=18765
          export PYTHONIOENCODING=utf-8
          export ENABLE_MODEL_PRELOAD=false
          cd dist/backend/soundbot-backend
          ./soundbot-backend > /tmp/backend_stdout.log 2>&1 &
          BACKEND_PID=$!

          # 轮询健康端点，最多等待 120 秒（torch 冷启动可能较慢）
          STARTED=false
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:18765/api/v1/health > /dev/null 2>&1; then
              STARTED=true
              echo "[OK] Backend responded on attempt ${i}s"
              break
            fi
            # 检查进程是否已提前崩溃
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "::error::Backend process exited early (crashed)"
              break
            fi
            sleep 1
          done

          kill $BACKEND_PID 2>/dev/null || true
          wait $BACKEND_PID 2>/dev/null || true

          echo "--- backend output (last 80 lines) ---"
          tail -80 /tmp/backend_stdout.log

          # 检查各类致命错误
          if grep -qiE "Could not import module|ImportError|ModuleNotFoundError|DLL load failed|OSError.*PortAudio|cannot import name" /tmp/backend_stdout.log; then
            echo "::error::Backend failed with import/library error"
            exit 1
          fi

          if [ "$STARTED" != "true" ]; then
            echo "::error::Backend failed to respond to /api/v1/health within 120 seconds"
            exit 1
          fi
          echo "[OK] Backend started and responded to health check"

      - name: Install Node dependencies
        run: npm ci --progress=false

      - name: Build Electron (macOS)
        run: |
          ulimit -n 65536
          npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Electron build
        run: |
          echo "=== Verifying Electron build ==="
          ls -lh dist-electron/

          if ls dist-electron/*.dmg 1> /dev/null 2>&1; then
            echo "[OK] DMG file created"
          else
            echo "[ERROR] DMG file not found"
            exit 1
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundbot-macos
          path: dist-electron/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install Python dependencies
        shell: powershell
        run: |
          pip install pyinstaller
          $lines = Get-Content backend/requirements.txt | Where-Object { $_ -notmatch 'uvloop' -and $_ -match '\S' }
          $lines | Set-Content requirements-filtered.txt
          pip install -r requirements-filtered.txt
          Remove-Item requirements-filtered.txt

      - name: Build PyInstaller backend
        shell: powershell
        run: |
          cd backend
          pyinstaller main.spec --distpath ../dist/backend --workpath ../dist/build --noconfirm

      - name: Verify backend build
        shell: powershell
        run: |
          Write-Host "=== Verifying backend build ==="
          $backendDir = 'dist/backend/soundbot-backend'
          if (Test-Path $backendDir) {
            Write-Host "[OK] Backend directory exists"
            Get-ChildItem $backendDir
            $size = [math]::Round((Get-ChildItem $backendDir -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 2)
            Write-Host "Backend size: $size MB"

            $exePath = Join-Path $backendDir 'soundbot-backend.exe'
            if (Test-Path $exePath) {
              Write-Host "[OK] Backend executable exists"
            } else {
              Write-Host "[ERROR] Backend executable not found"
              exit 1
            }

            $internalDir = Join-Path $backendDir '_internal'
            $libDir = Join-Path $backendDir 'lib'
            $hasInternal = Test-Path $internalDir
            $hasLib = Test-Path $libDir
            if ($hasInternal -or $hasLib) {
              Write-Host "[OK] Runtime directory exists"
            } else {
              Write-Host "[ERROR] Runtime directory not found"
              exit 1
            }
          } else {
            Write-Host "[ERROR] Backend directory not found"
            exit 1
          }

      - name: Test backend startup
        shell: powershell
        run: |
          Write-Host "=== Testing backend can start ==="
          $env:SOUNDBOT_PORT = "18765"
          $env:PYTHONIOENCODING = "utf-8"
          $env:ENABLE_MODEL_PRELOAD = "false"
          $exePath = Resolve-Path 'dist\backend\soundbot-backend\soundbot-backend.exe'
          $proc = Start-Process -FilePath $exePath `
            -RedirectStandardOutput backend_stdout.log `
            -RedirectStandardError backend_stderr.log `
            -WorkingDirectory (Split-Path $exePath) `
            -PassThru

          # 轮询健康端点，最多等待 120 秒（torch 冷启动可能较慢）
          $started = $false
          for ($i = 1; $i -le 120; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/api/v1/health' -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              if ($resp.StatusCode -eq 200) {
                $started = $true
                Write-Host "[OK] Backend responded on attempt ${i}s"
                break
              }
            } catch {}

            if ($proc.HasExited) {
              Write-Host "::error::Backend process exited early with code $($proc.ExitCode)"
              break
            }
            Start-Sleep -Seconds 1
          }

          if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2

          Write-Host "--- stdout (last 80 lines) ---"
          if (Test-Path backend_stdout.log) { Get-Content backend_stdout.log | Select-Object -Last 80 }
          Write-Host "--- stderr (last 80 lines) ---"
          if (Test-Path backend_stderr.log) { Get-Content backend_stderr.log | Select-Object -Last 80 }

          $allOutput = ""
          if (Test-Path backend_stdout.log) { $allOutput += Get-Content backend_stdout.log -Raw }
          if (Test-Path backend_stderr.log) { $allOutput += Get-Content backend_stderr.log -Raw }

          # 检查各类致命错误
          if ($allOutput -match "Could not import module|ImportError|ModuleNotFoundError|DLL load failed|PortAudio|cannot import name") {
            Write-Host "::error::Backend failed with import/library error"
            exit 1
          }

          if (-not $started) {
            Write-Host "::error::Backend failed to respond to /api/v1/health within 120 seconds"
            exit 1
          }
          Write-Host "[OK] Backend started and responded to health check"

      - name: Install Node dependencies
        run: npm ci --progress=false

      - name: Build Electron (Windows)
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      - name: Verify Electron build
        shell: powershell
        run: |
          Write-Host "=== Verifying Electron build ==="
          Get-ChildItem dist-electron/

          $exeFiles = Get-ChildItem dist-electron/*.exe
          if ($exeFiles) {
            Write-Host "[OK] EXE file created"
          } else {
            Write-Host "[ERROR] EXE file not found"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundbot-windows
          path: dist-electron/*.exe
          if-no-files-found: error

  create-release:
    needs: [build-models, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -exec ls -lh {} \;

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "SoundBot ${{ steps.tag.outputs.name }} Alpha"
          body: |
            ## 中文更新日志

            - 修复从数据库加载音频后波形字段未映射到前端绘制字段，导致波形不能立即正确显示的问题。
            - 优化波形补载策略，只对当前可见列表项请求缺失波形，避免启动后批量扫描整个音频库。
            - 优化播放链路，默认使用本地安全协议直读音频，避免通过 IPC 或后端转 WAV 搬运整文件。
            - 修复后端健康检查触发 CLAP 模型同步加载的问题，减少 Windows 启动等待时间。
            - 优化后端完整性检查，移除启动时递归统计 PyInstaller 目录大小的耗时操作。
            - 保持 WAV 导出、片段裁切、淡入淡出和拖拽导出链路使用原始文件路径，避免播放优化影响导出功能。

            ## English Changelog

            - Fixed waveform field mapping from the database to the frontend renderer so cached waveforms display immediately.
            - Limited missing-waveform loading to currently visible list items to avoid scanning the full library on startup.
            - Optimized playback to use a local secure audio protocol by default, avoiding whole-file IPC transfers and backend WAV transcoding.
            - Fixed the health check triggering synchronous CLAP model loading, reducing startup wait time on Windows.
            - Optimized backend integrity checks by removing the recursive PyInstaller directory size scan at startup.
            - Kept WAV export, clip extraction, fade processing, and drag export on original file paths so playback optimization does not affect export features.
          files: |
            artifacts/models-package/*.zip
            artifacts/soundbot-macos/*.dmg
            artifacts/soundbot-windows/*.exe
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
